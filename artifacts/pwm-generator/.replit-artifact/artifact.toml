kind = "web"
previewPath = "/"
title = "Audio PWM Generator"
version = "1.0.0"
id = "artifacts/pwm-generator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19660

[services.development]
run = "pnpm --filter @workspace/pwm-generator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pwm-generator", "run", "build" ]
publicDir = "artifacts/pwm-generator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19660"
BASE_PATH = "/"
