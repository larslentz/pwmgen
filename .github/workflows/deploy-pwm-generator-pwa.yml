name: Deploy PWM Generator PWA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for GitHub Pages
        run: pnpm --filter @workspace/pwm-generator-pwa run build
        env:
          PORT: 3000
          BASE_PATH: /pwmgen/

      - name: Validate the production PWA
        run: pnpm --filter @workspace/pwm-generator-pwa run test:pwa

      - name: Verify GitHub Pages base path
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const manifest = JSON.parse(fs.readFileSync("artifacts/pwm-generator-pwa/dist/public/manifest.webmanifest", "utf8"));
            if (manifest.start_url !== "/pwmgen/" || manifest.scope !== "/pwmgen/") {
              throw new Error(`Unexpected PWA path: start_url=${manifest.start_url}, scope=${manifest.scope}`);
            }
          '

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pwm-generator-pwa/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
